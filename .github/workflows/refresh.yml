name: Refresh

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-command-center
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild from Azure DevOps
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          DASHBOARD_HISTORY: '12'
        run: node scripts/build-public-dashboard.js
      - name: Publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Save the refreshed page
        run: |
          git add index.html history.json site/index.html site/history.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "Refresh Live+ Command Center"
          git push
